<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>Morais Drive</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;padding:16px}
header{text-align:center;padding:12px;color:#ff4545}
h1{margin:4px;font-size:28px}
h2{font-size:19px;color:#ff4545}
.card{background:#1c2933;padding:16px;border-radius:14px;margin:12px 0}
input,select,button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;font-size:16px}
button{background:#e93434;color:white;font-weight:bold}
.car{font-size:75px;text-align:center;margin:10px}
small{color:#b8c4ce}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#263743;padding:10px;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<header>
<h1>🚗 MORAIS DRIVE</h1>
<small>Sua central automotiva</small>
</header>

<section class="card">
<h2>Meu veículo</h2>
<div class="car" id="car">🚘</div>
<select id="modelo">
<option>Chevrolet Onix</option><option>Chevrolet Prisma</option>
<option>Chevrolet Celta</option><option>Hyundai HB20</option>
<option>Volkswagen Gol</option><option>Volkswagen Polo</option>
<option>Fiat Argo</option><option>Fiat Mobi</option>
<option>Fiat Uno</option><option>Fiat Palio</option>
<option>Renault Kwid</option><option>Toyota Corolla</option>
<option>Honda Civic</option><option>Jeep Renegade</option>
<option>Outro</option>
</select>
<select id="cor">
<option value="#ffffff">Branco</option><option value="#aaa">Prata</option>
<option value="#555">Cinza</option><option value="#111">Preto</option>
<option value="#d22">Vermelho</option><option value="#1675cc">Azul</option>
<option value="#27834a">Verde</option><option value="#e4c58b">Bege</option>
<option value="#e9c900">Amarelo</option>
</select>
<input id="ano" placeholder="Ano do veículo" type="number">
<input id="versao" placeholder="Versão (ex.: 1.4 LT)">
<select id="combustivel"><option>Flex</option><option>Gasolina</option><option>Etanol</option><option>Diesel</option><option>Elétrico</option></select>
<button onclick="salvarCarro()">Salvar veículo</button>
</section>

<section class="card">
<h2>📊 Painel</h2>
<div class="grid">
<div class="item">Quilometragem<br><b id="kmPainel">0 km</b></div>
<div class="item">Despesas<br><b id="totalPainel">R$ 0,00</b></div>
</div>
<input id="km" type="number" placeholder="Quilometragem atual">
<button onclick="salvarKm()">Atualizar quilometragem</button>
</section>

<section class="card">
<h2>⛽ Abastecimento</h2>
<input id="litros" type="number" step="0.01" placeholder="Litros">
<input id="valorComb" type="number" step="0.01" placeholder="Valor pago (R$)">
<input id="kmComb" type="number" placeholder="Quilometragem">
<button onclick="adicionar('comb')">Registrar abastecimento</button>
<div id="listaComb"></div>
</section>

<section class="card">
<h2>💰 Despesas</h2>
<select id="categoria">
<option>Combustível</option><option>Oficina</option><option>Peças</option>
<option>Óleo e filtros</option><option>Pneus</option><option>Lavagem</option>
<option>IPVA e licenciamento</option><option>Seguro</option><option>Multas</option><option>Outros</option>
</select>
<input id="descricao" placeholder="Descrição da despesa">
<input id="valorDesp" type="number" step="0.01" placeholder="Valor (R$)">
<button onclick="adicionar('desp')">Registrar despesa</button>
<div id="listaDesp"></div>
</section>

<section class="card">
<h2>🔧 Manutenção</h2>
<input id="servico" placeholder="Serviço realizado">
<input id="kmServico" type="number" placeholder="Quilometragem">
<input id="valorServico" type="number" step="0.01" placeholder="Custo (R$)">
<button onclick="adicionar('serv')">Registrar manutenção</button>
<div id="listaServ"></div>
</section>

<section class="card">
<h2>📁 Backup dos dados</h2>
<button onclick="backup()">Exportar backup</button>
<input type="file" id="arquivo" accept=".json">
<button onclick="restaurar()">Restaurar backup</button>
<small>Os registros ficam salvos neste aparelho. Faça backups regularmente.</small>
</section>

<script>
const ler=(k,d=[])=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const gravar=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let dados={comb:ler('comb'),desp:ler('desp'),serv:ler('serv')};
function dinheiro(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function salvarCarro(){
['modelo','cor','ano','versao','combustivel'].forEach(k=>localStorage.setItem(k,document.getElementById(k).value));
desenharCarro();alert('Veículo salvo!');
}
function desenharCarro(){
let c=localStorage.getItem('cor')||'#fff';
document.getElementById('car').innerHTML='<svg width="150" height="85" viewBox="0 0 180 100"><path d="M20 65 L35 35 Q40 25 55 25 H125 Q140 25 148 42 L160 65 V78 H20Z" fill="'+c+'" stroke="#aaa" stroke-width="3"/><path d="M50 32 H125 L140 55 H38Z" fill="#426071"/><circle cx="50" cy="76" r="13" fill="#111" stroke="#aaa" stroke-width="4"/><circle cx="135" cy="76" r="13" fill="#111" stroke="#aaa" stroke-width="4"/></svg>';
}
function salvarKm(){
let v=document.getElementById('km').value;
if(!v)return alert('Informe a quilometragem');
localStorage.setItem('kmAtual',v);atualizar();
}
function adicionar(tipo){
let obj={data:new Date().toLocaleDateString('pt-BR')};
if(tipo==='comb'){
obj.litros=litros.value;obj.valor=valorComb.value;obj.km=kmComb.value;
if(!obj.litros||!obj.valor)return alert('Preencha litros e valor');
}else if(tipo==='desp'){
obj.categoria=categoria.value;obj.descricao=descricao.value;obj.valor=valorDesp.value;
if(!obj.valor)return alert('Informe o valor');
}else{
obj.servico=servico.value;obj.km=kmServico.value;obj.valor=valorServico.value;
if(!obj.servico)return alert('Informe o serviço');
}
dados[tipo].unshift(obj);gravar(tipo,dados[tipo]);
['litros','valorComb','kmComb','descricao','valorDesp','servico','kmServico','valorServico'].forEach(k=>document.getElementById(k).value='');
atualizar();
}
function atualizar(){
['comb','desp','serv'].forEach(t=>{
let el=document.getElementById('lista'+(t==='comb'?'Comb':t==='desp'?'Desp':'Serv'));
el.innerHTML=dados[t].map(x=>'<div class="item">'+
(t==='comb'?'⛽ '+x.litros+' litros | '+x.km+' km':
t==='desp'?'💰 '+x.categoria+' | '+x.descricao:
'🔧 '+x.servico+' | '+x.km+' km')+
'<br>'+dinheiro(x.valor)+' | '+x.data+'</div>').join('');
});
let total=dados.comb.concat(dados.desp,dados.serv).reduce((s,x)=>s+Number(x.valor||0),0);
document.getElementById('totalPainel').textContent=dinheiro(total);
document.getElementById('kmPainel').textContent=(localStorage.getItem('kmAtual')||'0')+' km';
}
function backup(){
let blob=new Blob([JSON.stringify({dados,carro:Object.fromEntries(['modelo','cor','ano','versao','combustivel','kmAtual'].map(k=>[k,localStorage.getItem(k)]))},null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='morais-drive-backup.json';a.click();
}
function restaurar(){
let f=document.getElementById('arquivo').files[0];if(!f)return alert('Escolha um arquivo');
let r=new FileReader();r.onload=()=>{
try{let b=JSON.parse(r.result);dados=b.dados;Object.keys(dados).forEach(k=>gravar(k,dados[k]));if(b.carro)Object.entries(b.carro).forEach(([k,v])=>localStorage.setItem(k,v));location.reload();}
catch(e){alert('Arquivo de backup inválido');}
};r.readAsText(f);
}
['modelo','cor','ano','versao','combustivel'].forEach(k=>{let v=localStorage.getItem(k);if(v!==null)document.getElementById(k).value=v;});
desenharCarro();atualizar();
</script>
</body>
</html>
